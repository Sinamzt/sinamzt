<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Waving hand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
@keyframes wave{0%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(16deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(12deg)}60%,100%{transform:rotate(0)}}
.h{transform-origin:14px 34px;animation:wave 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.h{animation:none}}
</style>
<g class="h"><text x="4" y="31" font-size="28" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👋</text></g>
</svg>
